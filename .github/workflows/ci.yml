name: CI Pipeline

on:
  push:
    branches: [ master, feature/CICD_tests, feature/** ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd weather-flask-app
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run basic tests
      run: |
        cd weather-flask-app
        python -m pytest tests/test_basic.py -v || python tests/test_basic.py
    
    - name: Check syntax with flake8
      run: |
        cd weather-flask-app
        pip install flake8
        flake8 app.py --max-line-length=120 --max-complexity=10
    
    - name: Verify imports
      run: |
        cd weather-flask-app
        python -c "from app import app; print('Приложение импортируется успешно')"
    
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Create package structure
      run: |
        cd weather-flask-app
        echo "Проверка структуры проекта"
        ls -la
        
        tar -czf ../weather-app.tar.gz .
        echo "Создан архив: weather-app.tar.gz"
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: weather-app-build
        path: weather-app.tar.gz
        retention-days: 7