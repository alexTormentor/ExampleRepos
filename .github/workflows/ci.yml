name: CI Pipeline

on:
  push:
    branches: [ "master", "feature/*" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Run flake8 (проверка стиля кода)
      run: |
        # Проверяем только Python файлы
        find . -name "*.py" -not -path "./venv/*" -not -path "./weather-flask-app/venv/*" | xargs flake8 --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=127 || true

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask requests pytest
        
    - name: Run basic tests
      run: |
        cd weather-flask-app
        python -m pytest tests/test_basic.py -v

  verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask requests
        
    - name: Verify imports
      run: |
        cd weather-flask-app
        python -c "
try:
    from app import app, get_weather_description
    print('Все импорты работают корректно')
    print(f'App: {app}')
    print(f'Function: {get_weather_description}')
except Exception as e:
    import traceback
    print(f'Ошибка импорта: {e}')
    traceback.print_exc()
    exit(1)
        "
        
    - name: Check requirements.txt
      run: |
        if [ ! -f "weather-flask-app/requirements.txt" ]; then
          echo "Файл requirements.txt не найден"
          exit 1
        fi
        echo "requirements.txt существует"
        echo "Содержимое:"
        cat weather-flask-app/requirements.txt
