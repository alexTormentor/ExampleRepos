name: CI Pipeline

on:
  push:
    branches: [ "master", "feature/*" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        
    - name: Run flake8 (проверка стиля кода)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r weather-flask-app/requirements.txt
        
    - name: Run basic tests
      run: |
        cd weather-flask-app
        python -m pytest tests/test_basic.py -v

  verify:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r weather-flask-app/requirements.txt
        
    - name: Verify imports
      run: |
        cd weather-flask-app
        python -c "
        try:
            from app import app, get_weather_description
            print('Все импорты работают корректно')
        except Exception as e:
            print(f'Ошибка импорта: {e}')
            exit(1)
        "
        
    - name: Check requirements.txt
      run: |
        if [ ! -f "weather-flask-app/requirements.txt" ]; then
          echo "Файл requirements.txt не найден"
          exit 1
        fi
        echo "requirements.txt существует"
